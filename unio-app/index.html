<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/unio-SM.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vigía Transportes — Demo</title>
    <!-- SPA redirect restore for GitHub Pages -->
    <script>
      (function() {
        var search = window.location.search;
        if (search && search.slice(1, 3) === 'p=') {
          var decoded = decodeURIComponent(search.slice(3));
          // decoded is like "demo-vigia-transportes/some/path"
          window.history.replaceState(null, null, '/' + decoded);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
