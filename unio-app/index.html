<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/unio-SM.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vigía Transportes — Demo</title>
    <!-- SPA redirect restore for GitHub Pages -->
    <script>
      (function() {
        var p = window.location.search.slice(1);
        if (p.indexOf('p=') === 0) {
          var path = decodeURIComponent(p.slice(2).replace(/&/g, '?'));
          window.history.replaceState(null, null, '/' + path);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
