<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vigía Transportes — Demo</title>
    <script>
      // SPA redirect for GitHub Pages
      // Encodes the full path as a query param and redirects to index.html
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=' + encodeURIComponent(l.pathname.slice(1) + (l.search ? '&' + l.search.slice(1) : '') + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
